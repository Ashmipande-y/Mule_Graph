# Run from the repository root: docker compose -f backend/compose.yaml <cmd>
# Context is the repo root so the build can reach data/demo_transactions.json
# and ml/rules alongside backend/ (see backend/Dockerfile.dockerignore for
# what actually crosses into the build).

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Stage 1 JSON/in-memory demo mode. No DATABASE_URL: this backend
      # does not implement PostgreSQL persistence yet, so none is
      # configured here (backend/README.md Stage 3 is not started).
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
